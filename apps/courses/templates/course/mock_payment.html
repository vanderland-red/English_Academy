{% extends "base.html" %}
{% load static %}

{% block title %}
درگاه پرداخت | آکادمی زبان استیو
{% endblock %}

{% block body %}

<link rel="stylesheet" href="{% static 'css/gateway.css' %}">

<div class="payment-box">

    <div class="payment-header">

        <h2>درگاه پرداخت آزمایشی</h2>

        <p>English Academy Payment Gateway</p>

    </div>


    <div class="payment-info">

        <div class="info-row">

            <span>مبلغ قابل پرداخت</span>

            <strong>
                {{ payment.amount|floatformat:0 }} تومان
            </strong>

        </div>


        <div class="info-row">

            <span>وضعیت</span>

            <strong class="pending">
                در انتظار پرداخت
            </strong>

        </div>

    </div>


    <form action="{% url 'course:verify' payment.authority %}" method="POST">

        {% csrf_token %}


        <button type="submit" class="pay-btn" name="status" value="success">
            پرداخت موفق
        </button>


        <button type="submit" class="cancel-btn" name="status" value="failed">
            انصراف از پرداخت
        </button>

    </form>

</div>

{% endblock %}
